<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StarkLabs Top 20 Targets</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#08122b;color:#eef2ff}.wrap{max-width:1320px;margin:0 auto;padding:24px}h1{margin:0 0 8px}.sub{color:#a5b4fc;margin-bottom:20px}.cards{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:16px;margin-bottom:20px}.card{background:#101a3d;border:1px solid #273569;border-radius:16px;padding:16px}.k{color:#93c5fd;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.v{font-size:28px;font-weight:700;margin-top:4px}table{width:100%;border-collapse:collapse;background:#101a3d;border-radius:16px;overflow:hidden}th,td{border-bottom:1px solid #273569;padding:12px;vertical-align:top}th{color:#93c5fd;font-size:12px;text-transform:uppercase}.small{font-size:12px;color:#cbd5e1}.target-table{width:100%;border-collapse:collapse}.target-table td,.target-table th{border-bottom:1px solid #23315f;padding:6px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
<h1>StarkLabs Top 20 Daily Targets</h1>
<div class="sub">Daily stock list with 1 week, 1 month, 3 month, 6 month and 12 month target rows.</div>
<div class="cards">
<div class="card"><div class="k">Provider</div><div class="v" id="provider">-</div></div>
<div class="card"><div class="k">Universe</div><div class="v" id="universe" style="font-size:18px">-</div></div>
<div class="card"><div class="k">Stocks</div><div class="v" id="count">-</div></div>
<div class="card"><div class="k">Generated</div><div class="v" id="generated" style="font-size:18px">-</div></div>
</div>
<table>
<thead><tr><th>Rank</th><th>Symbol</th><th>Price</th><th>Day %</th><th>Momentum</th><th>Quality</th><th>Risk</th><th>Thesis</th><th>Targets</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
<script>
async function load(){const res=await fetch('./top20.json',{cache:'no-store'});const data=await res.json();document.getElementById('provider').textContent=data.provider;document.getElementById('universe').textContent=data.universe;document.getElementById('count').textContent=data.stocks.length;document.getElementById('generated').textContent=new Date(data.generatedAt).toLocaleString();const rows=document.getElementById('rows');rows.innerHTML='';for(const s of data.stocks){const tr=document.createElement('tr');const targetRows=(s.targets||[]).map(t=>`<tr><td>${t.horizon}</td><td>${t.targetPrice}</td><td>${t.upsidePct}%</td><td>${t.stopLoss}</td><td>${t.confidence}</td></tr>`).join('');tr.innerHTML=`<td>${s.rank}</td><td><strong>${s.symbol}</strong></td><td>${s.currentPrice}</td><td>${s.dayChangePct}%</td><td>${s.momentumScore}</td><td>${s.qualityScore}</td><td>${s.riskBand}</td><td class="small">${s.thesis}</td><td><table class="target-table"><thead><tr><th>Horizon</th><th>Target</th><th>Upside</th><th>Stop</th><th>Conf</th></tr></thead><tbody>${targetRows}</tbody></table></td>`;rows.appendChild(tr)}}load();
</script>
</body>
</html>
