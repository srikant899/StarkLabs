name: Daily Top 20 Stocks

on:
  workflow_dispatch:
  schedule:
    - cron: '15 22 * * 1-5'

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Generate top 20 report
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: |
          go run ./cmd/dailytop20

      - name: Commit report output
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/top20.json
          git diff --cached --quiet || git commit -m "Update daily top20 report"
          git push
