name: Pro Public Market Feed v3

on:
  workflow_dispatch:
  schedule:
    - cron: '9 14,18,22 * * 1-5'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Generate v3 pro public feed
        run: |
          go run ./cmd/publicfeedpro3

      - name: Commit updated v3 pro public feed
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/public-feed-pro-v3.json
          git diff --cached --quiet || git commit -m "Update v3 pro public market feed"
          git push
